[package]
name = "tabela"
version = "1.0.0"
description = "Tabelas de texto para o terminal: bordas, alinhamento, cores, barras e sparklines."
authors = ["DataForge"]
license = "MIT"
entry = "src/main.df"
dataforge = ">=1.0"
keywords = ["terminal", "cli", "tabela", "formatacao"]

[dependencies]

[lint]
# A largura das bordas e o numero de faixas do sparkline sao
# constantes de desenho, sem nome melhor que o proprio valor.
ignore = ["magic-number"]

[scripts]
test = "test tests/"
