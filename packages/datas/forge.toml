[package]
name = "datas"
version = "1.0.0"
description = "Datas em português: formatação, tempo relativo, dias úteis, feriados brasileiros e faixas."
authors = ["DataForge"]
license = "MIT"
entry = "src/main.df"
dataforge = ">=1.0"
keywords = ["data", "tempo", "feriado", "brasil", "calendario"]

[dependencies]

[lint]
# Os numeros do calendario (4 do ciclo bissexto, 7 dos dias da
# semana, 12 dos meses) sao a definicao do calendario gregoriano.
ignore = ["magic-number"]

[scripts]
test = "test tests/"
