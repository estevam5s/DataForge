[package]
name = "validador"
version = "1.0.0"
description = "Validação de dados: e-mail, CPF, CNPJ, CEP, telefone, cartão e senha, com regras encadeáveis."
authors = ["DataForge"]
license = "MIT"
entry = "src/main.df"
dataforge = ">=4.0"
keywords = ["validacao", "formulario", "cpf", "cnpj", "brasil"]

[dependencies]

[lint]
# A tabela de pesos do CPF/CNPJ e a especificacao do documento: sao
# numeros que nao se pode nomear, porque nao significam nada sozinhos.
ignore = ["magic-number"]

[scripts]
test = "test tests/"
