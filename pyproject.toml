[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge-lang"
version = "1.0.0"
description = "DataForge — linguagem de programação interpretada, construída sobre Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DataForge Team" }]
keywords = ["language", "interpreter", "dsl", "data", "compiler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.optional-dependencies]
# Pillow nao entra no runtime: ele so serve a 'tools/vetorizar_logo.py',
# que desenha o favicon e os icones, e ao teste que confere o resultado.
dev = ["pytest>=7.0", "Pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/estevam5s/DataForge"
Documentation = "https://github.com/estevam5s/DataForge/tree/main/doc"

[project.scripts]
dataforge = "dataforge.cli:main"
df = "dataforge.cli:main"

[tool.setuptools.packages.find]
include = ["dataforge*"]

[tool.setuptools.package-data]
dataforge = [
    "py.typed",
    # A extensao do VS Code viaja junto: 'dataforge editor' a instala
    # sem precisar do repositorio nem de internet.
    "editor/vscode/*",
    "editor/vscode/*/*",
    # O cliente LSP vive fundo em 'node_modules/<pacote>/lib/...', e os
    # dois globs acima param no segundo nivel. Sem esta linha o wheel
    # saia com a extensao e sem a unica biblioteca que ela carrega em
    # execucao — e o servidor de linguagem nao subia em NENHUMA
    # instalacao por pip, so na copia de desenvolvimento que tinha
    # rodado 'npm install'.
    "editor/vscode/node_modules/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: cria projetos de verdade em disco e roda a CLI neles",
]
