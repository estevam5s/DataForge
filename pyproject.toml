[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge-lang"
version = "1.0.0"
description = "DataForge — linguagem de programação interpretada, construída sobre Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DataForge Team" }]
keywords = ["language", "interpreter", "dsl", "data", "compiler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.optional-dependencies]
# Pillow nao entra no runtime: ele so serve a 'tools/vetorizar_logo.py',
# que desenha o favicon e os icones, e ao teste que confere o resultado.
dev = ["pytest>=7.0", "Pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/estevam5s/DataForge"
Documentation = "https://github.com/estevam5s/DataForge/tree/main/doc"

[project.scripts]
dataforge = "dataforge.cli:main"
df = "dataforge.cli:main"

# A lista e explicita, e nao 'find', por causa de 'dataforge.editor':
# a extensao do VS Code mora em 'editor/vscode/' na raiz, fora da pasta
# do pacote, e 'find' so acha o que tem '__init__.py' dentro de
# 'dataforge/'. O mapeamento abaixo a traz para dentro do wheel.
#
# 'tests/test_empacotamento.py' confere que esta lista tem todos os
# subpacotes que existem no disco — uma lista explicita que envelhece
# deixa um subpacote fora do wheel, e o sintoma e um ImportError so na
# instalacao por pip.
[tool.setuptools]
packages = [
    "dataforge",
    "dataforge.stdlib",
    "dataforge.stdlib.forge",
    "dataforge.stdlib.vitrine",
    "dataforge.editor",
]

[tool.setuptools.package-dir]
"dataforge.editor" = "editor"

[tool.setuptools.package-data]
dataforge = ["py.typed"]

# A extensao do VS Code viaja junto: 'dataforge editor' a instala sem
# precisar do repositorio nem de internet.
#
# Ela NAO estava entrando. Os globs viviam sob 'dataforge' e eram
# relativos a pasta do pacote — 'dataforge/editor/vscode/*', que nao
# existe. O wheel saia com ZERO arquivo da extensao, e
# 'dataforge editor' instalado por pip respondia "os arquivos da
# extensao nao foram encontrados". Tudo que a extensao faz — cores,
# snippets, LSP, depurador, os 49 comandos — nao chegava a ninguem que
# instalasse pela forma recomendada.
#
# 'out/**' e o JavaScript compilado: sem ele a extensao instala e nao
# ativa. 'node_modules/**' e o cliente LSP, que vive fundo em
# '<pacote>/lib/...'.
"dataforge.editor" = [
    "vscode/*",
    "vscode/*/*",
    "vscode/out/**/*",
    "vscode/snippets/**/*",
    "vscode/syntaxes/**/*",
    "vscode/node_modules/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: cria projetos de verdade em disco e roda a CLI neles",
]
