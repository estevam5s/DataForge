# Os executaveis que nao pedem Python.
#
# Instalar a linguagem exigia Python 3.10 ou mais novo. Para quem ja
# escreve Python isso e nada; para todo mundo mais e a primeira porta, e
# uma porta fechada. Aqui sai um arquivo por sistema: quem baixa, roda.
#
# Dispara numa tag 'vX.Y.Z', ou a mao pelo botao — util para conferir
# que os tres constroem antes de marcar a versao.

name: binarios

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nome: linux-x64
          - os: macos-latest
            nome: macos-arm64
          # Intel, e nao Apple Silicon: sao binarios diferentes e as
          # duas maquinas existem la fora.
          #
          # Era 'macos-13', e o GitHub RETIROU essa imagem: o job ficou
          # 'queued' por meia hora enquanto os outros tres terminavam,
          # sem nenhuma mensagem — um runner que nao existe nao da erro,
          # so nunca comeca. Foi o primeiro release do repositorio, e
          # por isso nao havia historico dizendo que aquilo nunca tinha
          # funcionado.
          #
          # 'macos-15' ainda publica imagem x64. Conferido em
          # github.com/actions/runner-images/releases: as imagens
          # recentes sao macos-14, macos-15 e macos-26, e apenas as
          # duas ultimas tem variante sem '-arm64'.
          - os: macos-15
            nome: macos-x64
          - os: windows-latest
            nome: windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # A versao mais velha que a linguagem suporta: o binario feito
          # num Python novo nao roda numa libc velha, e o contrario sim.
          python-version: '3.10'

      - name: instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      # Construir sem testar nao prova nada: um executavel que abre e
      # nao roda um '.df' e pior que nenhum, porque o usuario culpa a
      # linguagem e nao o empacotamento.
      - name: construir e provar
        run: python scripts/gerar_binario.py --verificar

      # 42 exemplos e 216 exercicios PELO BINARIO. Um '--version' que
      # responde nao prova que a linguagem funciona dentro do pacote:
      # foi assim que a primeira versao saiu sem a extensao do editor,
      # com o comando existindo e nao funcionando.
      - name: os exemplos e os exercicios rodam pelo binario
        shell: bash
        run: |
          BIN="dist/bin/dataforge/dataforge"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          BIN="$PWD/$BIN"
          falhas=0
          for f in examples/*.df; do
            "$BIN" run "$f" > /dev/null || { echo "FALHOU $f"; falhas=1; }
          done
          for d in exercicios/*/; do
            for f in "$d"[0-9]*.df; do
              [ -f "$f" ] || continue
              ( cd "$d" && "$BIN" run "$(basename "$f")" > /dev/null ) \
                || { echo "FALHOU $f"; falhas=1; }
            done
          done
          exit $falhas

      # A "caixinha": o instalador grafico do Windows.
      #
      # O Inno Setup vem pre-instalado no runner 'windows-latest'. Quem
      # baixa um '.exe' nao quer aprender o que e pip — e o executavel
      # que ele instala ja traz o Python dentro.
      - name: o instalador do Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          iscc packaging\windows\dataforge.iss
          if errorlevel 1 exit /b 1
          dir dist\pacotes

      - uses: actions/upload-artifact@v4
        with:
          name: dataforge-${{ matrix.nome }}
          # So o pacote comprimido: a pasta crua tem 28 MB e milhares de
          # arquivos, e o 'upload-artifact' os envia um a um.
          path: |
            dist/bin/*.tar.gz
            dist/bin/*.zip
            dist/pacotes/*.exe
          if-no-files-found: error

  # ── Os pacotes de distribuicao ──
  distros:
    name: .deb e PKGBUILD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .

      - name: gerar
        run: python packaging/gerar_pacotes.py

      # 'dpkg-deb' existe no runner do Ubuntu: um pacote quebrado e pior
      # que um pacote ausente, e so ele diz se o 'ar' esta certo.
      - name: o .deb e valido
        run: |
          deb=$(ls dist/pacotes/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      - uses: actions/upload-artifact@v4
        with:
          name: dataforge-distros
          path: |
            dist/pacotes/*.deb
            packaging/arch/PKGBUILD
          if-no-files-found: error

  publicar:
    name: anexar ao release
    needs: [construir, distros]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binarios
          merge-multiple: true

      # Os artefatos chegam com a ESTRUTURA DE PASTAS preservada —
      # 'bin/', 'dist/pacotes/', 'packaging/arch/' — porque o
      # 'upload-artifact' guarda o caminho de cada arquivo. O
      # 'merge-multiple' junta os quatro numa arvore, e nao numa pasta
      # plana.
      #
      # As quatro plataformas construiram e o release NAO SAIU por
      # causa disto: 'sha256sum *' encontrou os diretorios, escreveu
      # "Is a directory" e saiu com codigo 1.
      - name: achatar
        run: |
          find binarios -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' \
               -o -name '*.deb' -o -name 'PKGBUILD' \) \
            -exec mv -v {} binarios/ \;
          find binarios -mindepth 1 -type d -empty -delete
          ls -la binarios

      - name: somas de verificacao
        run: |
          cd binarios
          # Quem baixa por um link precisa poder conferir que o arquivo
          # e o que dizemos que e.
          #
          # '-maxdepth 1 -type f': so os arquivos desta pasta. Um
          # diretorio aqui derruba o passo, e foi o que aconteceu.
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          # 'binarios/*' com um diretorio dentro anexaria a PASTA, que
          # a acao recusa. Depois do 'achatar' sao todos arquivos.
          files: binarios/*
          generate_release_notes: true
